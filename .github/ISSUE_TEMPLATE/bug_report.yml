name: Bug report
description: Report a reproducible CombatGlass problem without private data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach packet captures, raw payloads, IP/MAC addresses, usernames, tokens, credentials or unrelated traffic."
  - type: input
    id: version
    attributes:
      label: CombatGlass version
      placeholder: Development preview or exact future version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Demo Mode, Live capture, Documentation or website]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted information only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true

