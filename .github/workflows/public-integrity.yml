name: public-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leakage-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject application source, captures, secrets and binaries
        shell: pwsh
        run: |
          $forbiddenExtensions = @('.rs','.cs','.cpp','.c','.h','.hpp','.pcap','.pcapng','.exe','.dll','.msi','.msix','.pfx','.p12','.pem','.key','.dmp')
          $forbiddenNames = @('Cargo.toml','Cargo.lock','.env')
          $forbiddenDirs = @('src','crates','captures','target','diagnostics','replays')
          $violations = Get-ChildItem -Recurse -File | Where-Object {
            $forbiddenExtensions -contains $_.Extension.ToLowerInvariant() -or
            $forbiddenNames -contains $_.Name -or
            ($_.FullName -split '[\\/]' | Where-Object { $forbiddenDirs -contains $_ }).Count -gt 0
          }
          if ($violations) { $violations.FullName; throw 'Forbidden private/source material detected.' }
          $secretPatterns = 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}'
          $secretHits = Get-ChildItem -Recurse -File | Select-String -Pattern $secretPatterns
          if ($secretHits) { $secretHits.Path | Sort-Object -Unique; throw 'Likely secret detected.' }
      - name: Validate public entrypoints and local assets
        shell: pwsh
        run: |
          $required = @('README.md','PRIVACY.md','SECURITY.md','FAQ.md','CHANGELOG.md','SUPPORT.md','DISCLAIMER.md','index.html','styles.css','assets/combatglass-mark.svg','assets/product-preview.svg')
          foreach ($file in $required) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" } }
          $html = Get-Content -Raw -LiteralPath index.html
          if ($html -match '(?i)download\s+(now|for windows)|\.exe|\.msi') { throw 'A download claim or binary reference appeared in the site.' }
          foreach ($asset in @('assets/combatglass-mark.svg','assets/product-preview.svg','styles.css')) { if ($html -notmatch [regex]::Escape($asset)) { throw "Unreferenced required asset: $asset" } }
      - name: Validate localized routes and generated content
        shell: pwsh
        run: |
          node scripts/generate-site.mjs --check
          $routes = [ordered]@{
            'index.html' = @('en', 'https://relis-lol.github.io/combatglass/')
            'de/index.html' = @('de', 'https://relis-lol.github.io/combatglass/de/')
            'fr/index.html' = @('fr', 'https://relis-lol.github.io/combatglass/fr/')
            'es/index.html' = @('es-ES', 'https://relis-lol.github.io/combatglass/es/')
            'pt-br/index.html' = @('pt-BR', 'https://relis-lol.github.io/combatglass/pt-br/')
            'ru/index.html' = @('ru', 'https://relis-lol.github.io/combatglass/ru/')
          }
          $alternates = @('en','de','fr','es-ES','pt-BR','ru','x-default')
          foreach ($entry in $routes.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $entry.Key -PathType Leaf)) { throw "Missing route $($entry.Key)" }
            $routeHtml = Get-Content -Raw -LiteralPath $entry.Key
            if ($routeHtml -notmatch ('<html lang="' + [regex]::Escape($entry.Value[0]) + '">')) { throw "Incorrect lang for $($entry.Key)" }
            if ($routeHtml -notmatch ('<link rel="canonical" href="' + [regex]::Escape($entry.Value[1]) + '">')) { throw "Incorrect canonical for $($entry.Key)" }
            foreach ($alternate in $alternates) {
              if ($routeHtml -notmatch ('hreflang="' + [regex]::Escape($alternate) + '"')) { throw "Missing hreflang $alternate in $($entry.Key)" }
            }
            $base = Split-Path -Parent $entry.Key
            if (-not $base) { $base = '.' }
            foreach ($match in [regex]::Matches($routeHtml, '(?:href|src)="([^"]+)"')) {
              $target = $match.Groups[1].Value.Split('#')[0].Split('?')[0]
              if (-not $target -or $target -match '^(?:https?:|mailto:|data:)') { continue }
              $resolved = Join-Path $base $target
              if (-not (Test-Path -LiteralPath $resolved)) { throw "Broken local link $target in $($entry.Key)" }
            }
          }
